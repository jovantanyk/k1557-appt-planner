services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:12348:5000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/app/static/uploads
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/planner.db
      - SUPERADMIN_SECRET=${SUPERADMIN_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - MIGHTPULSE_API_KEY=${MIGHTPULSE_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1